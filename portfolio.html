<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio | Exotic AI Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header class="page-head">
    <p class="eyebrow" style="justify-content:center">PORTFOLIO</p>
    <h1>Our <span>Work</span></h1>
    <p>Premium AI visuals across industries. Choose a category to explore.</p>
  </header>

  <section class="sec" style="padding-top:40px">
    <div class="filters">
      <button class="chip on" data-filter="all">All</button>
      <button class="chip" data-filter="jewellery">Jewellery</button>
      <button class="chip" data-filter="cosmetics">Cosmetics</button>
      <button class="chip" data-filter="realestate">Real Estate</button>
      <button class="chip" data-filter="fashion">Fashion</button>
      <button class="chip" data-filter="restaurants">Restaurants</button>
      <button class="chip" data-filter="Randomproducts">Random</button>
      <button class="chip" data-filter="creativePosters">Creative Posters</button>
    </div>
    <div class="works" id="works"></div>
  </section>

  <section class="final reveal">
    <h2>Like what you see?</h2>
    <p>Let's create yours.</p>
    <div class="cta" style="justify-content:center"><a href="contact.html" class="btn">Get a Quote</a></div>
  </section>
</main>
<script type="module" src="/script.js"></script>
</body>
</html>
